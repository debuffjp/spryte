<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spryte: HTML in canvas</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #panel { width: 120px; padding: 6px; background: #1d1d2b; border: 1px solid #cffb2d; border-radius: 3px; font: 8px system-ui, sans-serif; color: #eee; }
      #panel input { width: 100%; box-sizing: border-box; font: inherit; padding: 2px; margin: 3px 0 4px; }
      #panel button { font: inherit; padding: 2px 6px; margin-right: 3px; }
      #note { position: fixed; left: 8px; bottom: 8px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!-- Ordinary DOM: draw.element() moves it into the canvas and draws it there. -->
    <form id="panel">
      <label for="name">Your name</label>
      <input id="name" value="" placeholder="type here" autocomplete="off" />
      <button type="submit">Start</button><button type="button" id="quit">Quit</button>
      <p id="said">日本語もOK · <b>rich</b> <i>text</i> wraps on its own when the line is long.</p>
    </form>
    <p id="note"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
